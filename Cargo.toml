[package]
name = "nddev-device-sync-vault"
version = "0.0.1-alpha.4"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-vault"

[features]
default = []
development-http = ["nddev-device-sync-accounts/development-http"]

[dependencies]
base64 = "0.22"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["serde"] }
thiserror = "2"
uuid = { version = "1.27", features = ["v4"] }
nddev-device-sync-domain = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-core.git", rev = "d08e6b34c9ff6af1fdc179291f5386ec73c84926" }
nddev-device-sync-accounts = { git = "https://github.com/NDDev-OpenNetwork/nddev-device-sync-accounts.git", rev = "e4f41528fdd668ce32105576546e84d2bea5b05f" }
rusqlite = { version = "=0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
tokio = { version = "1.53", features = ["rt", "sync", "time"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
time = {version="0.3",features=["parsing"]}
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }

