[package]
name = "nddev-device-sync-vault"
version = "0.0.1-alpha.11"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-only"
repository = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-vault"

[features]
default = []
development-http = ["nddev-device-sync-accounts/development-http"]

[dependencies]
nddev-device-sync-application = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "8304a251f903b89b7169c8fb2d12a8ffd7666124" }
base64 = "0.23.1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = { version = "1.8", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
nddev-device-sync-telemetry = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-observability", rev = "6cf8b2ee69fd6a64bd218b47db55378191f66907" }
time = { version = "0.3", features = ["wasm-bindgen"] }
uuid = { version = "1.27", features = ["v4"] }
nddev-device-sync-domain = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-core.git", rev = "8304a251f903b89b7169c8fb2d12a8ffd7666124" }
nddev-device-sync-accounts = { git = "https://github.com/NDDev-Technocracy-OpenNetwork-NDS/nddev-device-sync-accounts", rev = "bf85c487e206706f84620cbe538ccf0dd39b5711" }

tokio = { version = "1.53", features = ["rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = "0.11.1"
base16ct = { version = "1.0", features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
time = {version="0.3",features=["parsing"]}
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
tokio = { version = "1.53", features = ["macros", "rt-multi-thread", "time"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["libsqlite3-sys", "bundled", "fallible_uint"] }
[target.'cfg(target_arch = "wasm32")'.dependencies]
rusqlite = { version="=0.40.2",default-features=false,features=["ffi-sqlite-wasm-rs","fallible_uint"] }
# rusqlite 0.40.2 requires sqlite-wasm-rs 0.5; VFS 0.3 uses incompatible
# rsqlite-vfs 0.2 callbacks. Upgrade this pair with a compatible rusqlite release.
sqlite-wasm-rs = "=0.5.5"
sqlite-wasm-vfs = "=0.2.0"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
uuid = { version="1.27",features=["js"] }
ring = { version="0.17",features=["wasm32_unknown_unknown_js"] }
